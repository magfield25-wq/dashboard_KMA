<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMA Business Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:linear-gradient(135deg,#f8fafc,#e8eef7);display:flex;align-items:center;justify-content:center;padding:24px;color:#111827}
.card{width:100%;max-width:760px;background:#fff;border-radius:28px;border-top:7px solid #C1121F;box-shadow:0 24px 60px rgba(15,23,42,.14);padding:34px}
.logo{display:block;max-width:440px;width:80%;height:auto;margin:0 auto 18px}
h1{text-align:center;font-size:28px;line-height:1.2;font-weight:900;color:#111827;margin-bottom:8px}
.sub{text-align:center;color:#6b7280;font-weight:800;margin-bottom:28px}
.login{display:grid;gap:12px;margin:0 auto 18px;max-width:560px}
input{height:52px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:16px;outline:none}
input:focus{border-color:#C1121F;box-shadow:0 0 0 4px rgba(193,18,31,.12)}
button,.menu a{height:52px;border:0;border-radius:14px;background:linear-gradient(135deg,#ef4444,#991b1b);color:#fff;font-size:16px;font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
button:hover,.menu a:hover{filter:brightness(.97)}
.msg{min-height:22px;text-align:center;color:#C1121F;font-weight:900;font-size:14px;margin-top:6px}
.menu{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.menu.show{display:grid}
.menu a{background:linear-gradient(135deg,#08245C,#C1121F);height:72px;font-size:17px}
.footer{text-align:center;color:#9ca3af;font-weight:800;margin-top:28px}
@media(max-width:640px){.card{padding:26px 18px;border-radius:22px}h1{font-size:24px}.logo{width:92%;margin-bottom:14px}.menu{grid-template-columns:1fr}.menu a{height:58px}}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="KMA">
  <h1>KMA Business Dashboard</h1>
  <div class="sub">방문·주문 분석 · 출고·정산 KPI</div>
  <div class="login" id="loginBox">
    <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginKMA()">
    <button type="button" onclick="loginKMA()">접속</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="menu" id="menuBox">
    <a href="visitor_order_dashboard_KMA.html">방문·주문 분석</a>
    <a href="kpi_settlement_dashboard_KMA.html">출고·정산 KPI</a>
  </div>
  <div class="footer">© KMA</div>
</div>
<script>
const KMA_PASSWORD = '1212';
const KMA_CLIENT_APP_CODE = 'KMA_20260522_A';
const KMA_SETTING_SHEET_ID = '1MZF9FQRS2Ej2B4kpVNLtjtaB95VDR_t5qtYFeuDzWQ0';
const KMA_SETTING_SHEET_NAME = '설정';
function kmaSetStorage(key,val){
  try{sessionStorage.setItem(key,val);}catch(e){}
  try{localStorage.setItem(key,val);}catch(e){}
}
function kmaGetStorage(key){
  try{return sessionStorage.getItem(key) || localStorage.getItem(key) || '';}catch(e){return '';}
}
function setMsg(t){document.getElementById('msg').textContent=t||'';}
function kmaGvizJsonpNoHeader(url){
  return new Promise((resolve,reject)=>{
    const cb='__kma_index_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    let done=false;
    const timer=setTimeout(()=>{if(done)return;cleanup();reject(new Error('버전 확인 시간 초과'));},15000);
    function cleanup(){done=true;clearTimeout(timer);try{delete window[cb];}catch(e){window[cb]=undefined;}if(script.parentNode)script.parentNode.removeChild(script);}
    window[cb]=function(j){cleanup();resolve(j);};
    script.onerror=function(){cleanup();reject(new Error('버전 확인 로드 실패'));};
    const sep=url.includes('?')?'&':'?';
    script.src=url+sep+'tqx='+encodeURIComponent('out:json;responseHandler:'+cb)+'&headers=0&rand='+Date.now();
    document.head.appendChild(script);
  });
}
function kmaExtractAppCode(j){
  const rows=(j && j.table && j.table.rows) ? j.table.rows : [];
  for(const row of rows){
    const cells=row.c || [];
    const a=String((cells[0] && (cells[0].f ?? cells[0].v)) ?? '').trim();
    const b=String((cells[1] && (cells[1].f ?? cells[1].v)) ?? '').trim();
    if(a.replace(/\s+/g,'').toUpperCase()==='APP_CODE') return b;
  }
  const cols=(j && j.table && j.table.cols) ? j.table.cols : [];
  for(let i=0;i<cols.length;i++){
    const label=String(cols[i].label||cols[i].id||'').trim().replace(/\s+/g,'').toUpperCase();
    if(label==='APP_CODE'){
      for(const row of rows){
        const cell=(row.c||[])[i];
        const v=String((cell && (cell.f ?? cell.v)) ?? '').trim();
        if(v) return v;
      }
    }
  }
  return '';
}
async function kmaFetchServerAppCode(){
  const url=`https://docs.google.com/spreadsheets/d/${KMA_SETTING_SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(KMA_SETTING_SHEET_NAME)}`;
  const j=await kmaGvizJsonpNoHeader(url);
  if(j && j.status==='error') throw new Error('설정 시트 로드 실패');
  const code=kmaExtractAppCode(j);
  if(!code) throw new Error('설정 시트 APP_CODE 없음');
  return code;
}
async function loginKMA(){
  const pw=document.getElementById('password').value;
  if(pw!==KMA_PASSWORD){setMsg('비밀번호가 맞지 않습니다.');return;}
  setMsg('버전 확인 중...');
  try{
    const serverCode=await kmaFetchServerAppCode();
    if(serverCode!==KMA_CLIENT_APP_CODE){
      setMsg('대시보드 버전이 만료되었습니다.');
      return;
    }
    kmaSetStorage('KMA_DASHBOARD_AUTH','OK');
    kmaSetStorage('KMA_APP_CODE',KMA_CLIENT_APP_CODE);
    setMsg('');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('menuBox').classList.add('show');
  }catch(e){
    setMsg('버전 확인 실패: '+e.message);
  }
}
(function init(){
  if(kmaGetStorage('KMA_DASHBOARD_AUTH')==='OK' && kmaGetStorage('KMA_APP_CODE')===KMA_CLIENT_APP_CODE){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('menuBox').classList.add('show');
  }
})();
</script>
</body>
</html>
